<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguas del Este - Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        .background {
            width: 100%;
            height: 100%;
            background-image: url('cortina1.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }
        
        /* Tablets en vertical y celulares */
        @media (max-width: 768px) {
            .background {
                background-image: url('cortina2.png');
            }
        }
        
        /* Celulares en horizontal */
        @media (max-height: 500px) and (orientation: landscape) {
            .background {
                background-image: url('cortina1.png');
            }
        }
        
        /* Pantallas muy anchas (ultra wide) */
        @media (min-aspect-ratio: 21/9) {
            .background {
                background-size: contain;
            }
        }
        
        /* Pantallas muy altas */
        @media (max-aspect-ratio: 9/16) {
            .background {
                background-size: 100% auto;
            }
        }
        
        .countdown-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .countdown-title {
            color: #ff0000;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .countdown {
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }
        
        .warning {
            color: #ff6666;
            font-family: Arial, sans-serif;
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .countdown-container {
                top: 10px;
                right: 10px;
                padding: 10px 15px;
            }
            
            .countdown-title {
                font-size: 12px;
            }
            
            .countdown {
                font-size: 18px;
            }
            
            .warning {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="countdown-container">
        <div class="countdown" id="countdown">30:00:00:00</div>
    </div>

    <script>
        // Fecha de expiración: 30 días desde ahora
        const expireDate = new Date();
        expireDate.setDate(expireDate.getDate() + 30);
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = expireDate.getTime() - now;
            
            if (distance < 0) {
                document.getElementById('countdown').innerHTML = '00:00:00:00';
                document.querySelector('.warning').innerHTML = 'SITIO EXPIRADO';
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').innerHTML = 
                String(days).padStart(2, '0') + ':' +
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
